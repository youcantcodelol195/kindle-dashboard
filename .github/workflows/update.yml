name: Update Kindle Dashboard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytz requests icalendar recurring-ical-events pillow

      - name: Render dashboard
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: python render_calendar.py

      - name: Commit and push updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update dashboard" && git push)
